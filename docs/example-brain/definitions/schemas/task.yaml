# Task Schema v1.1
# Defines the structure for task metadata

version: "1.1"
name: "task"
description: "Schema for task metadata"

fields:
  - name: created
    type: date
    required: false

  - name: due
    type: date
    required: false

  - name: priority
    type: string
    required: false
    description: "low, medium, high, urgent"

  - name: status
    type: string
    required: false
    default: "open"
    description: "open, in-progress, blocked, done, cancelled"

  - name: context
    type: string
    required: false

  - name: organization
    type: string
    required: false

  - name: project
    type: string
    required: false

  - name: tags
    type: array
    required: false

  - name: assigned
    type: string
    required: false

  - name: recurring
    type: string
    required: false

  - name: estimate
    type: string
    required: false
