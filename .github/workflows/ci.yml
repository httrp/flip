# GitHub Actions CI for flip CLI
# Runs build, lint, test, and smoke on push and PR

name: flip CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-lint-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        run: make build
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Smoke Test
        run: make smoke
